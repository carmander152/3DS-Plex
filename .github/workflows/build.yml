name: 3DS Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # We use the official devkitPro Docker image which has everything pre-installed
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build .3dsx
        # We run the standard make command directly; no library installation needed
        run: make

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Plex3DS-App
          # This saves the compiled output so you can download it directly from GitHub
          path: |
            *.3dsx
            *.smdh
